        <div class="recent-works-section">

                <h2 class="section-title">🆕 最近上传</h2>

                <input type="text" id="homeSearchInput" class="search-input" placeholder="搜索作品标题、标签、提示词...">
            </div>

                <!-- JS 自动渲染 -->
            </div>
        </div>
    </div>

    <!-- 作品详情弹窗 -->
    <div class="modal-mask" id="modalMask">
        <div class="modal-container">
            <span class="modal-close">×</span>
            <!-- 左侧媒体区 -->
            <div class="modal-left">
                <img id="modalImg" src="" alt="" style="display:none;">
                <video id="modalVideo" controls playsinline style="display:none; width:100%; border-radius:8px;"></video>
            </div>
            <!-- 右侧信息 -->
            <div class="modal-right">
                <h2 class="modal-title" id="modalTitle"></h2>
                <div class="modal-tags" id="modalTags"></div>
                <div class="prompt-box">
                    <div class="prompt-header">
                        <span>提示词内容</span>
                        <div class="prompt-actions">
                            <button class="copy-btn-small" data-clipboard-target="#modalPrompt">复制</button>
                        </div>
                    </div>
                    <textarea id="modalPrompt" readonly></textarea>
                </div>
                <div class="modal-actions">
                    <button class="copy-btn-main" data-clipboard-target="#modalPrompt">一键复制提示词</button>
                    <button class="share-btn-main" id="shareBtn" title="分享链接"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/common.js"></script>

    <script>
        async function loadRecentWorks() {
            try {
                // 同时加载图片和视频数据（fetch 失败回退到离线兜底 window.APP_DATA）
                let imageData, videoData;
                try {
                    const [imageRes, videoRes] = await Promise.all([
                        fetch('/api/data/image-prompts'),
                        fetch('/api/data/video-prompts')
                    ]);
                    if (!imageRes.ok) throw new Error('图片 API 状态 ' + imageRes.status);
                    if (!videoRes.ok) throw new Error('视频 API 状态 ' + videoRes.status);
                    imageData = await imageRes.json();
                    videoData = await videoRes.json();
                } catch (e) {
                    console.warn('API 中转失败，回退到直接请求 JSON 文件：', e);
                    try {
                        const [imageRes, videoRes] = await Promise.all([
                            fetch('/data/image-prompts.json'),
                            fetch('/data/video-prompts.json')
                        ]);
                        imageData = await imageRes.json();
                        videoData = await videoRes.json();
                    } catch (e2) {
                        console.warn('首页 fetch 失败，使用离线兜底数据：', e2);
                        imageData = (window.APP_DATA && window.APP_DATA.image) || [];
                        videoData = (window.APP_DATA && window.APP_DATA.video) || [];
                    }
                }

                // 合并数据并标注来源
                const allWorks = [
                    ...imageData.map(item => ({...item, type: '图片'})),
                    ...videoData.map(item => ({...item, type: '视频'}))
                ];

                // 按 order 倒序排列（order 大的排前面 = 新上传的靠前）
                allWorks.sort((a, b) => (b.order || 0) - (a.order || 0));

                renderHomeWorks(allWorks);

                // 检查URL是否有id参数，自动打开对应作品（支持新格式 img_1, vid_1 和旧格式纯数字）
                const urlParams = new URLSearchParams(window.location.search);
                const autoOpenId = urlParams.get('id');
                if (autoOpenId) {
                    const targetItem = allWorks.find(w => {
                        const wType = w.type === '视频' ? 'vid_' : 'img_';
                        const wDataId = wType + w.id;
                        return wDataId === autoOpenId || w.id === parseInt(autoOpenId);
                    });
                    if (targetItem) {
                        setTimeout(() => {
                            const wType = targetItem.type === '视频' ? 'vid_' : 'img_';
                            const card = document.querySelector('.home-work-card[data-id="' + wType + targetItem.id + '"]');
                            if (card) card.click();
                        }, 500);
                    }
                }

                // 更新作品数量统计
                const countEl = document.getElementById('worksCount');
                if (countEl) {
                    const imageCount = imageData.length;
                    const videoCount = videoData.length;
                    countEl.innerHTML = `📸 ${imageCount} 张图片 · 🎬 ${videoCount} 个视频`;
                    countEl.style.cssText = `
                        display: inline-block;
                        padding: 6px 16px;
                        background: #f3f4f6;
                        border-radius: 20px;
                        font-size: 14px;
                        color: #6b7280;
                    `;
                }

                // 初始化搜索
                initHomeSearch();
            } catch (error) {
                console.error('作品加载失败：', error);
            }
        }

        // 初始化首页搜索
        function initHomeSearch() {
            const searchInput = document.getElementById('homeSearchInput');
            if (searchInput) {
                let timer;
                searchInput.addEventListener('input', function() {
                    clearTimeout(timer);
                    timer = setTimeout(() => {
                        const keyword = this.value.trim().toLowerCase();
                        const allWorks = window.allWorks || [];
                        if (!keyword) {
                            renderHomeWorks(window.allWorks);
                        } else {
                            const filtered = allWorks.filter(item =>
                                item.title.toLowerCase().includes(keyword) ||
                                item.type.toLowerCase().includes(keyword) ||
                                item.prompt.toLowerCase().includes(keyword) ||
                                (item.tags || []).some(tag => tag.toLowerCase().includes(keyword))
                            );
                            renderHomeWorks(filtered, true);
                        }
                    }, 300);
                });
            }
        }

        // 渲染首页作品卡片
        function renderHomeWorks(works, isSearch = false) {
            // isSearch 为 true 表示是搜索触发的渲染，跳过 window.allWorks 赋值
            if (!isSearch) {
                window.allWorks = works;
            }
            const recent = [...works].sort(() => Math.random() - 0.5);
            const grid = document.getElementById('homeMasonryGrid');
            const ratioPool = [
                ...Array(50).fill('9/16'),
                ...Array(20).fill('3/5'),
                ...Array(20).fill('3/4'),
                ...Array(5).fill('16/9'),
                ...Array(5).fill('1/2')
            ];
            let cards = [];
            let lastRatio = '';
            for (let i = 0; i < recent.length; i++) {
                const item = recent[i];
                let available = ratioPool.filter(r => r !== lastRatio);
                if (available.length === 0) available = ratioPool;
                const ratioVal = available[Math.floor(Math.random() * available.length)];
                lastRatio = ratioVal;
                let coverHtml;
                if (item.type === '视频' && item.video_url) {
                    const posterUrl = 'https://cdn.jsdelivr.net/gh/420201953-dot/ai-videos@main/posters/' + item.video_url.split('/').pop().replace('.mp4', '.jpg');
                    coverHtml = `<div class="home-video-wrapper" style="background-color:var(--bg-color);background-image:url('${posterUrl}');background-size:cover;background-position:center;position:relative"><div class="video-loading-spinner"></div><video muted loop playsinline preload="none" data-src="${escapeHtml(item.video_url)}" class="home-card-video"></video></div>`;
                } else {
                    coverHtml = `<img src="${escapeHtml(item.cover)}" alt="${escapeHtml(item.title)}" loading="lazy" onerror="this.style.visibility='hidden'">`;
                }
                const dataId = (item.type === '视频' ? 'vid_' : 'img_') + item.id;
                cards.push(`<div class="home-work-card" data-id="${dataId}" data-type="${item.type}"><div class="home-card-cover" style="aspect-ratio:${ratioVal};background:var(--bg-color);">${coverHtml}</div></div>`);
            }
            grid.innerHTML = cards.join('');
            // 绑定点击和懒加载
            bindHomeWorkClick(works);
            initHomeVideoLazyLoad();
        }

        // 首页视频懒加载 — 串行高优先级，loadedmetadata 即放行，3s 超时兜底
        function initHomeVideoLazyLoad() {
            const videos = document.querySelectorAll('.home-video-wrapper video[data-src]');
            if (!videos.length) return;
            const maxConcurrent = 1;
            let queue = [];
            let loadingCount = 0;

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const video = entry.target;
                        if (video.src || video.hasAttribute('src')) {
                            observer.unobserve(video);
                            return;
                        }
                        if (queue.indexOf(video) === -1) {
                            queue.push(video);
                            startNext();
                        }
                    }
                });
            }, { rootMargin: '200px' });

            function startNext() {
                if (loadingCount >= maxConcurrent || queue.length === 0) return;
                const video = queue.shift();
                if (video.src || video.hasAttribute('src')) { startNext(); return; }
                const wrapper = video.closest('.home-video-wrapper');
                if (!wrapper) { startNext(); return; }

                loadingCount++;
                let settled = false;
                const settle = () => {
                    if (settled) return;
                    settled = true;
                    if (video.dataset.settled) return;
                    video.dataset.settled = '1';
                    video.removeEventListener('loadedmetadata', settle);
                    clearTimeout(timeoutTimer);
                    const spinner = wrapper.querySelector('.video-loading-spinner');
                    if (spinner) spinner.remove();
                    video.style.opacity = '1';
                    video.style.display = '';
                    video.muted = true;
                    try { video.currentTime = 0; } catch(e) {}
                    video.play().catch(() => { video.style.opacity = '0'; });
                    loadingCount--;
                    startNext();
                };
                // 超时 4s：仅在 seekable 真的没用时才隐藏 video，否则保留在原地
                const timeoutTimer = setTimeout(() => {
                    settle();
                    if (!video.seekable || video.seekable.length === 0) {
                        video.style.display = 'none';
                    }
                }, 4000);

                video.addEventListener('loadedmetadata', settle, { once: true });
                video.setAttribute('src', video.dataset.src);
                observer.unobserve(video);
            }
            videos.forEach(v => observer.observe(v));
            startNext();
        }

        document.addEventListener('DOMContentLoaded', loadRecentWorks);
    </script>
