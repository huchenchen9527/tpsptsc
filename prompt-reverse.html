<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>反求提示词 - AI创作资源站</title>
<link rel="stylesheet" href="css/style.css">
<style>
.reverse-tool-container{max-width:900px;margin:0 auto}
.upload-area{border:2px dashed var(--border-color);border-radius:12px;padding:60px 20px;text-align:center;cursor:pointer;transition:all .3s;background:var(--bg-color)}
.upload-area:hover{border-color:var(--accent-color);background:rgba(14,165,233,.03)}
.upload-area.dragover{border-color:var(--accent-color);background:rgba(14,165,233,.08)}
.upload-icon{font-size:56px;margin-bottom:12px}
.upload-text{font-size:18px;font-weight:600;color:var(--text-main);margin-bottom:6px}
.upload-hint{font-size:14px;color:var(--text-light)}
.loading-status{text-align:center;padding:20px 0;color:var(--text-sub);font-size:15px;display:none}
.loading-status .spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border-color);border-top-color:var(--accent-color);border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.preview-section{display:none;margin-top:16px}
.preview-image-wrap{width:100%;max-height:400px;overflow:hidden;border-radius:12px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.preview-image-wrap img{max-width:100%;max-height:400px;object-fit:contain}
.output-section{display:none}
.output-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.output-title{font-size:16px;font-weight:600}
.output-actions{display:flex;gap:8px}
.output-btn{padding:6px 16px;border-radius:6px;border:1px solid var(--border-color);background:var(--bg-color);color:var(--text-sub);font-size:13px;cursor:pointer;transition:all .2s}
.output-btn:hover{border-color:var(--accent-color);color:var(--accent-color)}
.output-btn.copied{background:#10b981;color:#fff;border-color:#10b981}
.prompt-box{background:var(--bg-color);border:1px solid var(--border-color);border-radius:10px;padding:16px;font-size:14px;line-height:1.8;color:var(--text-main);white-space:pre-wrap;word-break:break-all;font-family:Consolas,Monaco,monospace;min-height:80px}
.prompt-zh{margin-top:12px;padding-top:12px;border-top:1px solid var(--border-color);font-size:13px;color:var(--text-sub);font-family:inherit}
.reupload-link{text-align:center;margin-top:16px}
.reupload-link a{color:var(--accent-color);font-size:14px;cursor:pointer;text-decoration:none}
.reupload-link a:hover{text-decoration:underline}
.error-msg{text-align:center;padding:12px;color:#ef4444;font-size:14px;display:none}
@media(max-width:768px){.upload-area{padding:40px 16px}}
</style>
</head>
<body>
<nav class="nav-bar"><div class="nav-container"><div class="nav-logo">AI创作资源站</div><ul class="nav-menu"><li><a href="index.html">首页</a></li><li><a href="video.html">视频提示词库</a></li><li><a href="image.html">图片提示词库</a></li><li><a href="tools.html">AI工具集合</a></li><li><a href="prompt-reverse.html" class="active">反求提示词</a></li></ul></div></nav>
<div class="container">
<div class="page-header"><h1 class="page-title">反求提示词</h1><p class="page-desc">上传图片，AI 自动生成可直接使用的绘画提示词</p></div>
<div class="reverse-tool-container">
<div class="upload-area" id="uploadArea"><div class="upload-icon">🖼️</div><div class="upload-text">上传图片，自动生成提示词</div><div class="upload-hint">支持 JPG / PNG / WebP</div><input type="file" id="fileInput" accept="image/*" hidden></div>
<div class="loading-status" id="loadingStatus"><span class="spinner"></span>AI 正在分析图片，请稍候...</div>
<div class="error-msg" id="errorMsg"></div>
<div class="preview-section" id="previewSection"><div class="preview-image-wrap"><img id="previewImage" alt="预览图片"></div></div>
<div class="output-section" id="outputSection">
<div class="output-header"><span class="output-title">📋 生成的提示词</span><div class="output-actions"><button class="output-btn" id="copyBtn">📋 复制</button></div></div>
<div class="prompt-box" id="promptBox"></div>
<div class="prompt-zh" id="promptZh"></div>
<div class="reupload-link"><a id="reuploadLink">重新上传</a></div>
</div>
</div>
</div>
<footer class="footer"><div class="footer-container"><div class="footer-left"><div class="footer-logo">AI创作资源站</div><p class="footer-desc">精选AI提示词与实用工具，助力创作效率提升</p></div><div class="footer-column"><h4>功能导航</h4><ul><li><a href="video.html">视频提示词库</a></li><li><a href="image.html">图片提示词库</a></li><li><a href="tools.html">AI工具集合</a></li><li><a href="prompt-reverse.html">反求提示词</a></li></ul></div><div class="footer-column"><h4>关于</h4><ul><li><a href="#">关于本站</a></li><li><a href="#">反馈建议</a></li></ul></div></div><div class="footer-bottom">© 2025 AI创作资源站 · 个人站点</div></footer>
<script>
const uploadArea=document.getElementById('uploadArea');
const fileInput=document.getElementById('fileInput');
const previewSection=document.getElementById('previewSection');
const previewImage=document.getElementById('previewImage');
const loadingStatus=document.getElementById('loadingStatus');
const outputSection=document.getElementById('outputSection');
const promptBox=document.getElementById('promptBox');
const promptZh=document.getElementById('promptZh');
const errorMsg=document.getElementById('errorMsg');
const copyBtn=document.getElementById('copyBtn');
const reuploadLink=document.getElementById('reuploadLink');

uploadArea.addEventListener('click', () => fileInput.click());
uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
uploadArea.addEventListener('drop', e => { e.preventDefault(); uploadArea.classList.remove('dragover'); if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', function() { if (this.files.length) handleFile(this.files[0]); });

function handleFile(file) {
    if (!file.type.startsWith('image/')) { alert('请上传图片文件'); return; }
    const reader = new FileReader();
    reader.onload = function(e) {
        previewImage.src = e.target.result;
        uploadArea.style.display = 'none';
        previewSection.style.display = 'block';
        outputSection.style.display = 'none';
        errorMsg.style.display = 'none';
        loadingStatus.style.display = 'block';
        previewImage.onload = function() { analyzeImage(this); };
    };
    reader.readAsDataURL(file);
}

function analyzeImage(img) {
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const imageUrl = canvas.toDataURL('image/jpeg', 0.85);

    // 提取 base64 数据（去掉 data:image/... 前缀）
    const base64 = imageUrl.replace(/^data:image\/\w+;base64,/, '');

    fetch('/api/analyze-image', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: base64 })
    })
    .then(r => {
        if (!r.ok) throw new Error('后端 ' + r.status);
        return r.json();
    })
    .then(data => {
        const prompt = data.analysis || '';
        if (!prompt) throw new Error('Empty response');
        promptBox.textContent = prompt;
        promptZh.textContent = '中文说明：使用后端服务自动生成的绘画提示词，可直接用于 Midjourney、Stable Diffusion 等工具';
        outputSection.style.display = 'block';
        loadingStatus.style.display = 'none';
        outputSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
    })
    .catch(err => {
        console.error('分析失败', err);
        errorMsg.textContent = '⚠️ 分析失败，请检查后端服务是否正常运行（错误：' + err.message + '）';
        errorMsg.style.display = 'block';
        loadingStatus.style.display = 'none';
    });
}

reuploadLink.addEventListener('click', () => {
    uploadArea.style.display = 'block';
    previewSection.style.display = 'none';
    outputSection.style.display = 'none';
    errorMsg.style.display = 'none';
    fileInput.value = '';
});

copyBtn.addEventListener('click', function() {
    const text = promptBox.textContent;
    navigator.clipboard.writeText(text).then(() => {
        this.textContent = '✅ 已复制';
        this.classList.add('copied');
        setTimeout(() => {
            this.textContent = '📋 复制';
            this.classList.remove('copied');
        }, 2000);
    });
});
</script>
</body>
</html>
