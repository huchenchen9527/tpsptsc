<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI工具集合 - AI创作资源站</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="nav-bar">
        <div class="nav-container">
            <div class="nav-logo">AI创作资源站</div>
            <ul class="nav-menu">
                <li><a href="index.html">首页</a></li>
                <li><a href="video.html">视频提示词库</a></li>
                <li><a href="image.html">图片提示词库</a></li>
                <li><a href="tools.html" class="active">AI工具集合</a></li>
            </ul>
        </div>
    </nav>

    <!-- 页面主体 -->
    <div class="container">
        <div class="page-header">
            <h1 class="page-title">AI工具集合</h1>
            <p class="page-desc">精选主流AI工具，覆盖图像、视频、写作、设计全领域，直达官网不用找</p>
        </div>

        <!-- 分类筛选 -->
        <div class="filter-bar">
            <div class="filter-left">
                <button class="filter-btn active" data-category="all">集合</button>
                <!-- 分类按钮由 JS 动态生成 -->
            </div>
            <div class="filter-right">
                <input type="text" id="searchInput" class="search-input" placeholder="搜索工具...">
                <span id="resultCount">共 0 款工具</span>
            </div>
        </div>

        <!-- 工具卡片网格 -->
        <div class="tools-grid" id="toolsGrid">
            <!-- JS自动渲染 -->
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-left">
                <div class="footer-logo">AI创作资源站</div>
                <p class="footer-desc">精选AI提示词与实用工具，助力创作效率提升</p>
            </div>
            <div class="footer-column">
                <h4>功能导航</h4>
                <ul>
                    <li><a href="video.html">视频提示词库</a></li>
                    <li><a href="image.html">图片提示词库</a></li>
                    <li><a href="tools.html">AI工具集合</a></li>
                </ul>
            </div>
            <div class="footer-column">
                <h4>关于</h4>
                <ul>
                    <li><a href="#">关于本站</a></li>
                    <li><a href="#">反馈建议</a></li>
                </ul>
            </div>
        </div>
        <div class="footer-bottom">
            © 2025 AI创作资源站 · 个人站点
        </div>
    </footer>

    <!-- 引入通用脚本（含离线兜底数据 data.js 与通用逻辑 common.js） -->
    <script src="js/data.js"></script>
    <script src="js/common.js"></script>

    <!-- 页面初始化（复用 common.js 的 initToolsPage，含事件委托分类筛选与离线兜底） -->
    <script>
        initToolsPage({
            dataUrl: '/data/tools.json',
            dataKey: 'tools'
        });
    </script>
</body>
</html>
